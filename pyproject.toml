[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-agent-runtime"
version = "0.1.0"
description = "A minimal persistent agent runtime with tool calling and session isolation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0,<3.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.0",
    "respx>=0.21",
    "ruff>=0.9.0",
]

[project.scripts]
mini-agent = "mini_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/live"]
addopts = "--basetemp=.pytest_tmp"
pythonpath = ["."]
markers = [
    "live: tests that call real external services",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "corecoder",
    "tests/test_core.py",
    "tests/test_litellm.py",
    "tests/test_session.py",
    "tests/test_tools.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["mini_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
